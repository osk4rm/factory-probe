name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      # Both run before the build: cheap to check, expensive to discover later.
      - name: Migration safety (expand/contract)
        run: pwsh -File scripts/ci/migrations.ps1
      - name: Production compose sanity
        run: pwsh -File scripts/ci/check-compose.ps1
      - name: Container hardening (no SDK, non-root, healthcheck)
        run: pwsh -File scripts/ci/check-dockerfile.ps1
      - run: dotnet build SwarmApp.slnx -c Release --nologo
      - run: dotnet format SwarmApp.slnx --verify-no-changes --no-restore
      - run: dotnet test SwarmApp.slnx -c Release --nologo

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
